{% extends "base.html" %}
{% block title %}{{ copy.void_payment }} - Nasiya{% endblock %}
{% block content %}
<main class="payment-page">
  <h1>{{ copy.void_payment }}</h1>
  {% if error_message %}<p role="alert">{{ error_message }}</p>{% endif %}
  <form method="post" action="/shop/payments/{{ payment_id }}/void">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="idempotency_key" value="{{ idempotency_key }}">
    <input type="hidden" name="expected_revision" value="{{ expected_revision }}">
    <label for="reason">{{ copy.void_reason }}</label>
    <select id="reason" name="reason" required>
      {% for reason, label in reasons %}<option value="{{ reason.value }}">{{ label }}</option>{% endfor %}
    </select>
    <label><input type="checkbox" name="confirmation" value="yes" required> {{ copy.void_confirm }}</label>
    <button type="submit">{{ copy.void_submit }}</button>
  </form>
</main>
{% endblock %}
