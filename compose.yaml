services:
  db:
    image: postgres:16
    command: ["postgres", "-c", "log_error_verbosity=terse"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nasiya}
      POSTGRES_USER: ${POSTGRES_USER:-nasiya}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_pass}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nasiya} -d ${POSTGRES_DB:-nasiya}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command:
      ["server", "/data", "--address", ":9000", "--console-address", ":9001", "--quiet"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-minio-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-minio-root-secret-at-least-32-chars}
    volumes:
      - minio-data:/data
    ports:
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_BIND_ADDRESS:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    entrypoint: ["/bin/sh", "/scripts/minio-init.sh"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-minio-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-minio-root-secret-at-least-32-chars}
      MINIO_BUCKET: ${MINIO_BUCKET:-nasiya-private}
      MINIO_APP_ACCESS_KEY: ${MINIO_APP_ACCESS_KEY:-local-nasiya-storage-app}
      MINIO_APP_SECRET_KEY: ${MINIO_APP_SECRET_KEY:-change-me-local-nasiya-storage-app-secret-at-least-32-chars}
      MINIO_APP_POLICY_NAME: ${MINIO_APP_POLICY_NAME:-nasiya-storage-app}
    volumes:
      - ./deploy/minio-init.sh:/scripts/minio-init.sh:ro
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+psycopg://${POSTGRES_USER:-nasiya}:${POSTGRES_PASSWORD:-dev_pass}@db:5432/${POSTGRES_DB:-nasiya}}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+psycopg://${POSTGRES_USER:-nasiya}:${POSTGRES_PASSWORD:-dev_pass}@db:5432/${POSTGRES_DB:-nasiya}}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      RATE_LIMIT_HMAC_KEY: ${RATE_LIMIT_HMAC_KEY:-change-me-local-rate-limit-hmac-key-at-least-32-chars}
      OTP_HMAC_KEY: ${OTP_HMAC_KEY:-}
      OTP_REGISTRATION_TTL_SECONDS: ${OTP_REGISTRATION_TTL_SECONDS:-180}
      OTP_REGISTRATION_MAX_VERIFY_ATTEMPTS: ${OTP_REGISTRATION_MAX_VERIFY_ATTEMPTS:-5}
      OTP_REGISTRATION_RESEND_COOLDOWN_SECONDS: ${OTP_REGISTRATION_RESEND_COOLDOWN_SECONDS:-60}
      OTP_REGISTRATION_RATE_LIMIT_WINDOW_SECONDS: ${OTP_REGISTRATION_RATE_LIMIT_WINDOW_SECONDS:-900}
      OTP_REGISTRATION_RATE_LIMIT_PHONE_ATTEMPTS: ${OTP_REGISTRATION_RATE_LIMIT_PHONE_ATTEMPTS:-3}
      OTP_REGISTRATION_RATE_LIMIT_USER_ATTEMPTS: ${OTP_REGISTRATION_RATE_LIMIT_USER_ATTEMPTS:-3}
      OTP_REGISTRATION_RATE_LIMIT_IP_ATTEMPTS: ${OTP_REGISTRATION_RATE_LIMIT_IP_ATTEMPTS:-20}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      OBJECT_STORAGE_ENDPOINT_URL: ${OBJECT_STORAGE_ENDPOINT_URL:-}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-}
      OBJECT_STORAGE_ACCESS_KEY: ${OBJECT_STORAGE_ACCESS_KEY:-}
      OBJECT_STORAGE_SECRET_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
      OBJECT_STORAGE_USE_SSL: ${OBJECT_STORAGE_USE_SSL:-}
      OBJECT_STORAGE_ADDRESSING_STYLE: ${OBJECT_STORAGE_ADDRESSING_STYLE:-path}
      OBJECT_STORAGE_PRESIGNED_TTL_SECONDS: ${OBJECT_STORAGE_PRESIGNED_TTL_SECONDS:-300}
      OBJECT_STORAGE_MAX_UPLOAD_BYTES: ${OBJECT_STORAGE_MAX_UPLOAD_BYTES:-10485760}
      OBJECT_STORAGE_MAX_MULTIPART_BYTES: ${OBJECT_STORAGE_MAX_MULTIPART_BYTES:-11010048}
      OBJECT_STORAGE_MAX_IMAGE_PIXELS: ${OBJECT_STORAGE_MAX_IMAGE_PIXELS:-40000000}
      OBJECT_STORAGE_MAX_IMAGE_DIMENSION: ${OBJECT_STORAGE_MAX_IMAGE_DIMENSION:-16384}
      OBJECT_STORAGE_UPLOAD_RATE_LIMIT_WINDOW_SECONDS: ${OBJECT_STORAGE_UPLOAD_RATE_LIMIT_WINDOW_SECONDS:-900}
      OBJECT_STORAGE_UPLOAD_RATE_LIMIT_USER_ATTEMPTS: ${OBJECT_STORAGE_UPLOAD_RATE_LIMIT_USER_ATTEMPTS:-5}
      OBJECT_STORAGE_UPLOAD_RATE_LIMIT_IP_ATTEMPTS: ${OBJECT_STORAGE_UPLOAD_RATE_LIMIT_IP_ATTEMPTS:-20}
      OBJECT_STORAGE_RECONCILE_STALE_SECONDS: ${OBJECT_STORAGE_RECONCILE_STALE_SECONDS:-60}
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "8000:8000"
  telegram-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.telegram.worker", "run"]
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+psycopg://${POSTGRES_USER:-nasiya}:${POSTGRES_PASSWORD:-dev_pass}@db:5432/${POSTGRES_DB:-nasiya}}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      RATE_LIMIT_HMAC_KEY: ${RATE_LIMIT_HMAC_KEY:-change-me-local-rate-limit-hmac-key-at-least-32-chars}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-m", "app.telegram.worker", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
  otp-dispatcher:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.otp.dispatcher", "run"]
    environment:
      APP_ENVIRONMENT: ${APP_ENVIRONMENT:-development}
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL_DOCKER:-postgresql+psycopg://${POSTGRES_USER:-nasiya}:${POSTGRES_PASSWORD:-dev_pass}@db:5432/${POSTGRES_DB:-nasiya}}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      RATE_LIMIT_HMAC_KEY: ${RATE_LIMIT_HMAC_KEY:-change-me-local-rate-limit-hmac-key-at-least-32-chars}
      OTP_HMAC_KEY: ${OTP_HMAC_KEY:-}
      OTP_REGISTRATION_TTL_SECONDS: ${OTP_REGISTRATION_TTL_SECONDS:-180}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: ["CMD", "python", "-m", "app.otp.dispatcher", "healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 1
volumes:
  db-data:
  minio-data:
