name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  dependency-sync:
    runs-on: ubuntu-latest
    env:
      APP_ENVIRONMENT: testing
      DEBUG: "false"
      SESSION_COOKIE_NAME: nasiya_session
      SESSION_COOKIE_SECURE: "false"
      SESSION_TTL_DAYS: "30"
      ANONYMOUS_SESSION_TTL_MINUTES: "30"
      SESSION_TOUCH_INTERVAL_MINUTES: "5"
      PASSWORD_MIN_LENGTH: "8"
      PASSWORD_MAX_LENGTH: "128"
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: "900"
      LOGIN_RATE_LIMIT_PHONE_ATTEMPTS: "5"
      LOGIN_RATE_LIMIT_IP_ATTEMPTS: "20"
      TELEGRAM_LINK_RATE_LIMIT_WINDOW_SECONDS: "900"
      TELEGRAM_LINK_RATE_LIMIT_USER_ATTEMPTS: "3"
      TELEGRAM_LINK_RATE_LIMIT_PHONE_ATTEMPTS: "3"
      TELEGRAM_LINK_RATE_LIMIT_IP_ATTEMPTS: "20"
      RATE_LIMIT_HMAC_KEY: ci-test-only-rate-limit-hmac-key-at-least-32-chars
      DATABASE_URL: postgresql+psycopg://nasiya:dev_pass@127.0.0.1:5432/nasiya_test
      TEST_DATABASE_URL: postgresql+psycopg://nasiya:dev_pass@127.0.0.1:5432/nasiya_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nasiya_test
          POSTGRES_USER: nasiya
          POSTGRES_PASSWORD: dev_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nasiya -d nasiya_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --dev --frozen

      - name: Run Alembic migrations
        run: uv run alembic upgrade head

      - name: Show Alembic current revision
        run: uv run alembic current

      - name: Verify Alembic M16 head
        run: |
          current_revision="$(uv run alembic current | awk '{print $1}')"
          test "$current_revision" = "c7d8e9f0a1b2"

      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Generate and mask MinIO test credentials
        id: minio-credentials
        run: |
          minio_root_user="ci-minio-root-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          minio_root_password="$(openssl rand -hex 32)"
          minio_app_access_key="ci-nasiya-app-$(openssl rand -hex 8)"
          minio_app_secret_key="$(openssl rand -hex 32)"
          minio_bucket="nasiya-ci-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          umask 077
          minio_root_env_file="$(
            mktemp "$RUNNER_TEMP/nasiya-minio-root.XXXXXX"
          )"
          for masked_value in \
            "$minio_root_user" \
            "$minio_root_password" \
            "$minio_app_access_key" \
            "$minio_app_secret_key"; do
            echo "::add-mask::$masked_value"
          done
          {
            echo "MINIO_ROOT_USER=$minio_root_user"
            echo "MINIO_ROOT_PASSWORD=$minio_root_password"
          } >"$minio_root_env_file"
          chmod 600 "$minio_root_env_file"
          echo "root_env_file=$minio_root_env_file" >>"$GITHUB_OUTPUT"
          {
            echo "MINIO_APP_ACCESS_KEY=$minio_app_access_key"
            echo "MINIO_APP_SECRET_KEY=$minio_app_secret_key"
            echo "MINIO_BUCKET=$minio_bucket"
            echo "MINIO_APP_POLICY_NAME=nasiya-storage-app"
            echo "M8_MINIO_TEST_ENDPOINT=http://127.0.0.1:9000"
            echo "M8_MINIO_TEST_BUCKET=$minio_bucket"
            echo "M8_MINIO_TEST_ACCESS_KEY=$minio_app_access_key"
            echo "M8_MINIO_TEST_SECRET_KEY=$minio_app_secret_key"
            echo "M8_MINIO_CI_VOLUME=nasiya-ci-minio-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          } >>"$GITHUB_ENV"

      - name: Start bounded pinned MinIO runtime
        env:
          M8_MINIO_ROOT_ENV_FILE: ${{ steps.minio-credentials.outputs.root_env_file }}
        run: |
          docker run --detach \
            --name nasiya-ci-minio \
            --publish 127.0.0.1:9000:9000 \
            --env-file "$M8_MINIO_ROOT_ENV_FILE" \
            --mount "type=volume,src=$M8_MINIO_CI_VOLUME,dst=/data" \
            --health-cmd "mc ready local" \
            --health-interval 1s \
            --health-timeout 3s \
            --health-retries 30 \
            quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e \
            server /data --address :9000
          attempt=1
          while [ "$attempt" -le 30 ]; do
            health="$(
              docker inspect \
                --format '{{.State.Health.Status}}' \
                nasiya-ci-minio
            )"
            if [ "$health" = "healthy" ]; then
              exit 0
            fi
            if [ "$health" = "unhealthy" ]; then
              echo "MinIO healthcheck failed."
              exit 1
            fi
            attempt=$((attempt + 1))
            sleep 1
          done
          echo "MinIO healthcheck timed out."
          exit 1

      - name: Initialize private MinIO policy twice
        env:
          M8_MINIO_ROOT_ENV_FILE: ${{ steps.minio-credentials.outputs.root_env_file }}
        run: |
          run_minio_init() {
            docker run --rm \
              --network host \
              --entrypoint /bin/sh \
              --env-file "$M8_MINIO_ROOT_ENV_FILE" \
              --env MINIO_ENDPOINT=http://127.0.0.1:9000 \
              --env MINIO_BUCKET \
              --env MINIO_APP_ACCESS_KEY \
              --env MINIO_APP_SECRET_KEY \
              --env MINIO_APP_POLICY_NAME \
              --volume "$PWD/deploy/minio-init.sh:/scripts/minio-init.sh:ro" \
              quay.io/minio/mc:RELEASE.2025-08-13T08-35-41Z@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727 \
              /scripts/minio-init.sh
          }
          run_minio_init
          run_minio_init

      - name: Run admin-plane MinIO backup restore acceptance
        env:
          M8_MINIO_ROOT_ENV_FILE: ${{ steps.minio-credentials.outputs.root_env_file }}
        run: |
          set -eu
          evidence_file=""
          evidence_published=false
          stdout_file=""
          stderr_file=""
          cleanup_admin() {
            unset MINIO_ROOT_USER MINIO_ROOT_PASSWORD
            rm -f -- "$M8_MINIO_ROOT_ENV_FILE" || true
            if [ -n "$stdout_file" ]; then
              rm -f -- "$stdout_file" || true
            fi
            if [ -n "$stderr_file" ]; then
              rm -f -- "$stderr_file" || true
            fi
            if [ "$evidence_published" != "true" ] \
              && [ -n "$evidence_file" ]; then
              rm -f -- "$evidence_file" || true
            fi
          }
          fail_admin() {
            printf '%s\n' \
              "STORAGE_BACKUP_RESTORE_FAILED code=CI_VALIDATION" >&2
            exit 1
          }
          trap cleanup_admin EXIT
          trap 'exit 1' HUP INT TERM

          if [ ! -f "$M8_MINIO_ROOT_ENV_FILE" ] \
            || [ -L "$M8_MINIO_ROOT_ENV_FILE" ] \
            || [ "$(stat -c '%a' "$M8_MINIO_ROOT_ENV_FILE")" != "600" ]; then
            fail_admin
          fi
          if [ "$(wc -l <"$M8_MINIO_ROOT_ENV_FILE")" -ne 2 ] \
            || ! grep -Eq \
              '^MINIO_ROOT_USER=ci-minio-root-[0-9]+-[0-9]+$' \
              "$M8_MINIO_ROOT_ENV_FILE" \
            || ! grep -Eq \
              '^MINIO_ROOT_PASSWORD=[0-9a-f]{64}$' \
              "$M8_MINIO_ROOT_ENV_FILE"; then
            fail_admin
          fi

          set -a
          . "$M8_MINIO_ROOT_ENV_FILE"
          set +a
          export MINIO_ENDPOINT=http://127.0.0.1:9000
          export MINIO_DOCKER_NETWORK=host
          export M8_STORAGE_BACKUP_PARENT="$RUNNER_TEMP"
          stdout_file="$(
            mktemp "$RUNNER_TEMP/nasiya-storage-backup.stdout.XXXXXX"
          )"
          stderr_file="$(
            mktemp "$RUNNER_TEMP/nasiya-storage-backup.stderr.XXXXXX"
          )"
          chmod 600 "$stdout_file" "$stderr_file"

          set +e
          deploy/minio-backup-restore-exercise.sh \
            >"$stdout_file" 2>"$stderr_file"
          exercise_status=$?
          set -e
          if [ "$exercise_status" -ne 0 ]; then
            safe_failure="$(
              sed -n '1p' "$stderr_file"
            )"
            if [ ! -s "$stdout_file" ] \
              && [ "$(wc -l <"$stderr_file")" -eq 1 ] \
              && printf '%s\n' "$safe_failure" | grep -Eq \
                '^STORAGE_BACKUP_RESTORE_FAILED code=(CONFIG|SOURCE_WRITE|READY|CONFIGURED_PRIVACY|SOURCE_BUCKET|SEED_COPY|BACKUP|RESTORE_BUCKET|RESTORE|SOURCE_COUNT|RESTORE_COUNT|COUNT_MATCH|METADATA|CONTENT|PRIVACY)$'; then
              printf '%s\n' "$safe_failure" >&2
              exit "$exercise_status"
            fi
            fail_admin
          fi

          expected="STORAGE_BACKUP_RESTORE_PASS source=1 backup=1 restored=1 checksum=VERIFIED privacy=PRIVATE"
          if [ -s "$stderr_file" ] \
            || [ "$(wc -l <"$stdout_file")" -ne 1 ] \
            || [ "$(sed -n '1p' "$stdout_file")" != "$expected" ]; then
            fail_admin
          fi

          umask 077
          evidence_file="$(
            mktemp "$RUNNER_TEMP/nasiya-storage-backup-evidence.XXXXXX"
          )"
          printf '%s\n' "$expected" >"$evidence_file"
          chmod 600 "$evidence_file"
          unset MINIO_ROOT_USER MINIO_ROOT_PASSWORD
          rm -f -- "$M8_MINIO_ROOT_ENV_FILE"
          if [ -e "$M8_MINIO_ROOT_ENV_FILE" ]; then
            fail_admin
          fi
          printf 'M8_STORAGE_BACKUP_EVIDENCE_FILE=%s\n' \
            "$evidence_file" >>"$GITHUB_ENV"
          evidence_published=true

      - name: Run narrow private MinIO integration
        run: uv run pytest -q tests/test_storage_minio_integration.py

      - name: Run M5 containment guard
        run: uv run pytest -q tests/test_shop_containment_guard.py

      - name: Run M5 historical regressions
        run: |
          uv run pytest -q \
            tests/test_shop_session_desync_http.py \
            tests/test_shop_get_leakage_xss_audit.py

      - name: Run M6 Telegram fake-runtime guard
        run: |
          uv run pytest -q \
            tests/test_telegram_bot_api.py \
            tests/test_telegram_worker.py \
            tests/test_telegram_worker_lock_postgresql.py \
            tests/test_telegram_update_processing_postgresql.py \
            tests/test_telegram_post_commit_reply.py

      - name: Run M7 OTP containment and fake-runtime guard
        run: |
          uv run pytest -q \
            tests/test_otp_dispatcher.py \
            tests/test_otp_concurrency_containment_matrix.py \
            tests/test_otp_enumeration_matrix.py \
            tests/test_otp_sensitive_data_audit.py

      - name: Run full pytest
        run: |
          set +e
          test_output="$(uv run pytest -ra)"
          test_status=$?
          set -e
          printf '%s\n' "$test_output"
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi
          if grep -Eq '(^|, )[0-9]+ (skipped|xfailed|xpassed)(,| in|$)' \
            <<<"$test_output"; then
            echo "Full suite must have zero skipped, xfailed, or xpassed tests."
            exit 1
          fi

      - name: Clean up MinIO test runtime
        if: always()
        env:
          M8_MINIO_ROOT_ENV_FILE: ${{ steps.minio-credentials.outputs.root_env_file }}
        run: |
          docker rm --force nasiya-ci-minio >/dev/null 2>&1 || true
          docker volume rm "$M8_MINIO_CI_VOLUME" >/dev/null 2>&1 || true
          rm -f -- "$M8_MINIO_ROOT_ENV_FILE"
          if [ -n "${M8_STORAGE_BACKUP_EVIDENCE_FILE:-}" ]; then
            rm -f -- "$M8_STORAGE_BACKUP_EVIDENCE_FILE"
          fi
