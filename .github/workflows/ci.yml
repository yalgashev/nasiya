name: CI

"on":
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  dependency-sync:
    runs-on: ubuntu-latest
    env:
      APP_ENVIRONMENT: testing
      DEBUG: "false"
      SESSION_COOKIE_NAME: nasiya_session
      SESSION_COOKIE_SECURE: "false"
      SESSION_TTL_DAYS: "30"
      ANONYMOUS_SESSION_TTL_MINUTES: "30"
      SESSION_TOUCH_INTERVAL_MINUTES: "5"
      PASSWORD_MIN_LENGTH: "8"
      PASSWORD_MAX_LENGTH: "128"
      LOGIN_RATE_LIMIT_WINDOW_SECONDS: "900"
      LOGIN_RATE_LIMIT_PHONE_ATTEMPTS: "5"
      LOGIN_RATE_LIMIT_IP_ATTEMPTS: "20"
      TELEGRAM_LINK_RATE_LIMIT_WINDOW_SECONDS: "900"
      TELEGRAM_LINK_RATE_LIMIT_USER_ATTEMPTS: "3"
      TELEGRAM_LINK_RATE_LIMIT_PHONE_ATTEMPTS: "3"
      TELEGRAM_LINK_RATE_LIMIT_IP_ATTEMPTS: "20"
      RATE_LIMIT_HMAC_KEY: ci-test-only-rate-limit-hmac-key-at-least-32-chars
      DATABASE_URL: postgresql+psycopg://nasiya:dev_pass@127.0.0.1:5432/nasiya_test
      TEST_DATABASE_URL: postgresql+psycopg://nasiya:dev_pass@127.0.0.1:5432/nasiya_test

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nasiya_test
          POSTGRES_USER: nasiya
          POSTGRES_PASSWORD: dev_pass
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nasiya -d nasiya_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Sync dependencies
        run: uv sync --dev --frozen

      - name: Run Alembic migrations
        run: uv run alembic upgrade head

      - name: Show Alembic current revision
        run: uv run alembic current

      - name: Verify Alembic M8 head
        run: |
          current_revision="$(uv run alembic current | awk '{print $1}')"
          test "$current_revision" = "f8a9b0c1d2e3"

      - name: Run Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run M5 containment guard
        run: uv run pytest -q tests/test_shop_containment_guard.py

      - name: Run M5 historical regressions
        run: |
          uv run pytest -q \
            tests/test_shop_session_desync_http.py \
            tests/test_shop_get_leakage_xss_audit.py

      - name: Run M6 Telegram fake-runtime guard
        run: |
          uv run pytest -q \
            tests/test_telegram_bot_api.py \
            tests/test_telegram_worker.py \
            tests/test_telegram_worker_lock_postgresql.py \
            tests/test_telegram_update_processing_postgresql.py \
            tests/test_telegram_post_commit_reply.py

      - name: Run M7 OTP containment and fake-runtime guard
        run: |
          uv run pytest -q \
            tests/test_otp_dispatcher.py \
            tests/test_otp_concurrency_containment_matrix.py \
            tests/test_otp_enumeration_matrix.py \
            tests/test_otp_sensitive_data_audit.py

      - name: Run full pytest
        run: |
          set +e
          test_output="$(uv run pytest -ra)"
          test_status=$?
          set -e
          printf '%s\n' "$test_output"
          if [ "$test_status" -ne 0 ]; then
            exit "$test_status"
          fi
          if grep -Eq '(^|, )[0-9]+ (skipped|xfailed|xpassed)(,| in|$)' \
            <<<"$test_output"; then
            echo "Full suite must have zero skipped, xfailed, or xpassed tests."
            exit 1
          fi
